name: DailyDevFinds

on:
  schedule:
    # Runs at 12:30 UTC = 18:00 IST (can be delayed by 5-30 min by GitHub)
    - cron: "30 12 * * *"
  workflow_dispatch: {}

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write  # needed to commit state/posted.json
      id-token: write  # for OIDC if needed

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --dev
        working-directory: ./dailydevfinds

      - name: Install Playwright browsers
        run: uv run playwright install chromium
        working-directory: ./dailydevfinds

      - name: Run DailyDevFinds agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          PRODUCTHUNT_TOKEN: ${{ secrets.PRODUCTHUNT_TOKEN }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
        run: uv run python -m dailydevfinds.main
        working-directory: ./dailydevfinds

      - name: Commit and push state/posted.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/posted.json
          git diff --staged --quiet || git commit -m "chore: update posted.json [skip ci]"
          git push
        working-directory: ./dailydevfinds

      - name: Upload logs as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dailydevfinds-logs
          path: dailydevfinds/logs/
          retention-days: 7