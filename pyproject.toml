[project]
name = "dailydevfinds"
version = "0.1.0"
description = "Daily developer resource discovery agent - finds one useful tool/day and emails a LinkedIn-ready post"
readme = "README.md"
authors = [
    { name = "Manthan Raut", email = "manthanr141@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "groq>=0.5.0",
    "beautifulsoup4>=4.15.0",
    "feedparser>=6.0.14",
    "httpx>=0.28.1",
    "playwright>=1.63.0",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.4",
    "resend>=2.49.1",
    "tenacity>=9.1.4",
    "trafilatura>=2.3.0",
    "pytz>=2026.5",
    "pyyaml>=6.0",
]

[project.scripts]
dailydevfinds = "dailydevfinds.main:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 100
target-version = "py312"
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM", "T20", "PIE"]
ignore = ["E501", "S101"]
fix = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
